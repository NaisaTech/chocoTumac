sonar.projectKey=NaisaTech_chocoTumac
sonar.organization=naisatech
sonar.projectName=chocoTumac
sonar.projectVersion=1.2.0

# Analizar solo los modelos (lógica de negocio pura)
sonar.sources=models

# Incluir tests para análisis de cobertura
sonar.tests=tests

# Exclusiones del análisis de código fuente
sonar.exclusions=**/vendor/**,**/node_modules/**,**/public/**,**/database/**,**/docs/**,**/.scannerwork/**

# Exclusiones del análisis de pruebas (helpers y bootstrap no son tests)
sonar.test.exclusions=tests/bootstrap.php,tests/TestHelper.php

# Cobertura generada por PHPUnit
sonar.php.coverage.reportPaths=tests/reports/coverage.xml

# Resultados de tests en formato JUnit
sonar.php.tests.reportPath=tests/reports/junit.xml

sonar.sourceEncoding=UTF-8
sonar.php.version=8.0

# Suprimir falso positivo: parámetros no usados en métodos de interfaz
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S1172
sonar.issue.ignore.multicriteria.e1.resourceKey=models/**

# Suprimir advertencia de null pointer (PDO siempre lanza excepción, nunca retorna null)
sonar.issue.ignore.multicriteria.e2.ruleKey=php:S2259
sonar.issue.ignore.multicriteria.e2.resourceKey=models/**

# Excluir duplicación en archivos de test (es normal tener patrones similares)
sonar.cpd.exclusions=tests/**
