name: SonarCloud Analysis – ChocoTumac

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master

jobs:
  sonarcloud:
    name: Analisis SonarCloud
    runs-on: ubuntu-latest

    steps:
      # actions/checkout@v4 → SHA del commit exacto de la release v4.2.2
      # Verificar en: https://github.com/actions/checkout/releases/tag/v4.2.2
      - name: Checkout del repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0   # Necesario para que SonarCloud analice el historial completo

      # SonarSource/sonarcloud-github-action@v3.1.0 → SHA del commit exacto
      # Verificar en: https://github.com/SonarSource/sonarcloud-github-action/releases/tag/v3.1.0
      - name: Analisis con SonarCloud
        uses: SonarSource/sonarcloud-github-action@e44258b109568baa0df60ed515909fc6c72cba92  # v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN:  ${{ secrets.SONAR_TOKEN }}