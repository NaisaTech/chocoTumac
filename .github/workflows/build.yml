name: Build
on:
  push:
    branches:
      - main
      - test
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.2.2
      # SHA verificable en: https://github.com/actions/checkout/releases/tag/v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      # SonarSource/sonarqube-scan-action@v6.0.0
      # SHA verificable en: https://github.com/SonarSource/sonarqube-scan-action/releases/tag/v6.0.0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@aa604d7b6f01f95156a9f8cc3c03d4e8b87db93a  # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}